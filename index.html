<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A web tool that decodes broken emojis (square boxes) on Windows into their actual emoji images. Just copy and paste.">
    <title>Emoji Decoder</title>
    
    <!-- PWA Manifest & Theme Color -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#C850C0">
    <link rel="icon" href="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/72x72/1f50d.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Twemoji Library -->
    <script src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js"></script>

    <style>
        :root {
            --bg-gradient-1: #4158D0;
            --bg-gradient-2: #C850C0;
            --bg-gradient-3: #FFCC70;
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.3);
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', 'Outfit', sans-serif;
            background-color: var(--bg-gradient-1);
            background-image: linear-gradient(43deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 46%, var(--bg-gradient-3) 100%);
            background-attachment: fixed;
            color: var(--text-color);
            overflow: hidden;
            position: relative;
        }

        /* Animated Background Blobs */
        .blob {
            position: absolute;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.6;
        }
        .blob-1 {
            width: 400px; height: 400px;
            background: #ff0055;
            top: -100px; left: -100px;
            animation: move 10s infinite alternate;
        }
        .blob-2 {
            width: 500px; height: 500px;
            background: #00ccff;
            bottom: -200px; right: -100px;
            animation: move 12s infinite alternate-reverse;
        }

        @keyframes move {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(50px, 50px) scale(1.1); }
        }
        
        /* Language Selector */
        .lang-selector {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 20;
        }
        
        .lang-selector select {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 8px 12px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            backdrop-filter: blur(10px);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .lang-selector select:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .lang-selector select option {
            background: #4158D0;
            color: white;
        }

        /* Glassmorphism Container */
        .glass-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 550px;
            padding: 40px 30px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .glass-container:hover {
            transform: translateY(-5px);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            font-size: 15px;
            font-weight: 300;
            opacity: 0.9;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        /* Input Field */
        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 80px;
            padding: 15px 20px;
            font-size: 18px;
            font-family: 'Inter', sans-serif;
            background: rgba(255, 255, 255, 0.2);
            border: 2px dashed rgba(255, 255, 255, 0.5);
            border-radius: 16px;
            color: white;
            outline: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
            resize: none;
        }

        textarea:focus {
            background: rgba(255, 255, 255, 0.3);
            border-style: solid;
            border-color: white;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        textarea::placeholder {
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
        }

        /* Result Area */
        .result-area {
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 10px;
            word-break: break-word;
            text-align: left;
            font-size: 20px;
            line-height: 1.6;
        }

        #status-message {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
            width: 100%;
        }

        /* Twemoji CSS */
        img.emoji {
            height: 1.2em;
            width: 1.2em;
            margin: 0 .15em 0 .15em;
            vertical-align: -0.2em;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Footer */
        footer {
            margin-top: 25px;
            font-size: 12px;
            opacity: 0.5;
        }
        
        footer a {
            color: white;
            text-decoration: none;
        }
        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    
    <div class="glass-container">
        <div class="lang-selector">
            <select id="lang-select">
                <option value="en">🇺🇸 English</option>
                <option value="ko">🇰🇷 한국어</option>
                <option value="ja">🇯🇵 日本語</option>
            </select>
        </div>

        <h1 data-i18n="title">Emoji Decoder 🔍</h1>
        <p class="subtitle" data-i18n="subtitle">Paste the entire message containing broken "square box" (□) emojis<br>to reveal what they actually are.</p>

        <div class="input-group">
            <textarea id="emoji-input" data-i18n-placeholder="placeholder" placeholder="Paste your message here..." autocomplete="off" spellcheck="false"></textarea>
        </div>

        <div class="result-area" id="result-area">
            <div id="status-message" data-i18n="defaultStatus">The decoded message will appear here.</div>
        </div>
        
        <footer data-i18n="footer">
            Parsed and rendered using <a href="https://github.com/twitter/twemoji" target="_blank">Twemoji</a>
        </footer>
    </div>

    <script>
        // i18n Dictionary
        const i18nData = {
            en: {
                title: 'Emoji Decoder 🔍',
                subtitle: 'Paste the entire message containing broken "square box" (□) emojis<br>to reveal what they actually are.',
                placeholder: 'Paste your message here...',
                defaultStatus: 'The decoded message will appear here.',
                footer: 'Parsed and rendered using <a href="https://github.com/twitter/twemoji" target="_blank">Twemoji</a>'
            },
            ko: {
                title: '이모티콘 해독기 🔍',
                subtitle: '네모(□)로 깨진 이모티콘이 포함된 메시지 전체를<br>아래에 붙여넣어 실제 이모티콘을 확인하세요.',
                placeholder: '여기에 메시지를 붙여넣으세요...',
                defaultStatus: '해독된 메시지가 여기에 나타납니다.',
                footer: '<a href="https://github.com/twitter/twemoji" target="_blank">Twemoji</a>를 사용하여 파싱 및 렌더링됨'
            },
            ja: {
                title: '絵文字デコーダー 🔍',
                subtitle: '文字化けした「四角い箱」(□)の絵文字を含むメッセージ全体を<br>貼り付けて、実際の絵文字を確認してください。',
                placeholder: 'ここにメッセージを貼り付けます...',
                defaultStatus: 'デコードされたメッセージがここに表示されます。',
                footer: '<a href="https://github.com/twitter/twemoji" target="_blank">Twemoji</a>を使用して解析およびレンダリング'
            }
        };

        let currentLang = localStorage.getItem('preferredLang') || 'en';
        const langSelect = document.getElementById('lang-select');
        langSelect.value = currentLang;

        function applyLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('preferredLang', lang);
            document.documentElement.lang = lang;
            
            // Translate all elements with data-i18n attribute
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18nData[lang][key]) {
                    el.innerHTML = i18nData[lang][key];
                }
            });
            
            // Translate placeholders
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (i18nData[lang][key]) {
                    el.placeholder = i18nData[lang][key];
                }
            });
            
            // Re-evaluate current status message if input is empty
            const inputField = document.getElementById('emoji-input');
            if (!inputField.value.trim()) {
                resetUI();
            }
        }

        langSelect.addEventListener('change', (e) => {
            applyLanguage(e.target.value);
        });

        // App Logic
        const inputField = document.getElementById('emoji-input');
        const resultArea = document.getElementById('result-area');

        function resetUI() {
            resultArea.innerHTML = `<div id="status-message" data-i18n="defaultStatus">${i18nData[currentLang].defaultStatus}</div>`;
        }

        function decodeMessage() {
            const val = inputField.value.trim();
            
            if (!val) {
                resetUI();
                return;
            }

            // 1. Set text securely to prevent XSS
            resultArea.textContent = val;

            // 2. Parse text and replace emojis with Twemoji <img> tags
            twemoji.parse(resultArea, {
                base: 'https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/',
                folder: '72x72',
                ext: '.png'
            });
            
            // If the text contains only emojis, make them larger
            const childNodes = Array.from(resultArea.childNodes);
            const hasText = childNodes.some(node => node.nodeType === Node.TEXT_NODE && node.textContent.trim() !== '');
            
            if (!hasText) {
                const images = resultArea.querySelectorAll('img.emoji');
                images.forEach(img => {
                    img.style.height = '2.5em';
                    img.style.width = '2.5em';
                    img.style.margin = '0 0.1em';
                });
                resultArea.style.justifyContent = 'center';
                resultArea.style.display = 'flex';
                resultArea.style.flexWrap = 'wrap';
            } else {
                resultArea.style.display = 'block';
            }
        }

        inputField.addEventListener('input', decodeMessage);
        
        // Auto-select text on focus for easy pasting
        inputField.addEventListener('focus', () => {
            inputField.select();
        });

        // Register Service Worker for PWA Support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                .then(registration => {
                    console.log('SW registered: ', registration);
                })
                .catch(registrationError => {
                    console.log('SW registration failed: ', registrationError);
                });
            });
        }

        // Apply initial language on load
        applyLanguage(currentLang);
    </script>
</body>
</html>
