<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A web tool that decodes broken emojis (square boxes) on Windows into their actual emoji images. Just copy and paste.">
    <title>Emoji Decoder</title>
    
    <!-- PWA Manifest & Theme Color -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#C850C0">
    <link rel="icon" href="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/72x72/1f50d.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Twemoji Library -->
    <script src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js"></script>

    <style>
        :root {
            --bg-gradient-1: #4158D0;
            --bg-gradient-2: #C850C0;
            --bg-gradient-3: #FFCC70;
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.3);
            --text-color: #ffffff;
            --input-bg: rgba(255, 255, 255, 0.2);
            --result-bg: rgba(0, 0, 0, 0.15);
            --history-bg: rgba(255, 255, 255, 0.1);
            --button-bg: rgba(255, 255, 255, 0.2);
            --button-hover: rgba(255, 255, 255, 0.3);
        }

        [data-theme="light"] {
            --bg-gradient-1: #FFDEE9;
            --bg-gradient-2: #B5FFFC;
            --bg-gradient-3: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(255, 255, 255, 0.8);
            --text-color: #333333;
            --input-bg: rgba(255, 255, 255, 0.7);
            --result-bg: rgba(255, 255, 255, 0.5);
            --history-bg: rgba(0, 0, 0, 0.05);
            --button-bg: rgba(0, 0, 0, 0.05);
            --button-hover: rgba(0, 0, 0, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', 'Outfit', sans-serif;
            background-color: var(--bg-gradient-1);
            background-image: linear-gradient(43deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 46%, var(--bg-gradient-3) 100%);
            background-attachment: fixed;
            color: var(--text-color);
            overflow: hidden;
            position: relative;
            transition: background 0.5s ease, color 0.5s ease;
        }

        /* Animated Background Blobs */
        .blob {
            position: absolute;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.6;
            transition: opacity 0.5s ease;
        }
        [data-theme="light"] .blob { opacity: 0.4; }
        .blob-1 {
            width: 400px; height: 400px;
            background: #ff0055;
            top: -100px; left: -100px;
            animation: move 10s infinite alternate;
        }
        .blob-2 {
            width: 500px; height: 500px;
            background: #00ccff;
            bottom: -200px; right: -100px;
            animation: move 12s infinite alternate-reverse;
        }

        @keyframes move {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(50px, 50px) scale(1.1); }
        }

        /* Glassmorphism Container */
        .glass-container {
            position: relative;
            z-index: 10;
            width: 90vw;
            max-width: 400px; /* Vertical messenger width */
            min-height: 70vh; /* Taller vertical layout */
            max-height: 850px;
            padding: 40px 25px 25px 25px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            text-align: center;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        /* Controls: Theme & Language */
        .top-controls {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 20;
            display: flex;
            gap: 8px;
        }

        .theme-toggle, .lang-selector select {
            background: var(--button-bg);
            color: var(--text-color);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 8px 12px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            backdrop-filter: blur(10px);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .theme-toggle:hover, .lang-selector select:hover {
            background: var(--button-hover);
        }
        .lang-selector select option {
            background: #4158D0;
            color: white;
        }
        [data-theme="light"] .lang-selector select option {
            background: #ffffff;
            color: #333333;
        }

        h1 {
            font-size: clamp(24px, 5vw, 30px);
            font-weight: 700;
            margin-top: 15px;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            font-size: clamp(13px, 3vw, 15px);
            font-weight: 300;
            opacity: 0.8;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        /* Input Field */
        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        textarea {
            width: 100%;
            height: 80px;
            padding: 15px 20px;
            font-size: 18px;
            font-family: 'Inter', sans-serif;
            background: var(--input-bg);
            border: 2px dashed var(--glass-border);
            border-radius: 16px;
            color: var(--text-color);
            outline: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
            resize: none;
        }

        textarea:focus {
            background: var(--button-hover);
            border-style: solid;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        textarea::placeholder {
            color: var(--text-color);
            opacity: 0.6;
            font-size: 16px;
        }

        /* History Tray */
        .history-tray {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px;
            margin-bottom: 15px;
            background: var(--history-bg);
            border-radius: 12px;
            min-height: 30px;
            align-items: center;
        }
        .history-tray::-webkit-scrollbar { height: 4px; }
        .history-tray::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 4px; }
        [data-theme="light"] .history-tray::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); }
        
        .history-item {
            cursor: pointer;
            transition: transform 0.2s;
            font-size: 20px;
            white-space: nowrap;
        }
        .history-item:hover { transform: scale(1.2); }
        .history-empty { font-size: 12px; opacity: 0.5; width: 100%; text-align: center; }

        /* Result Area */
        .result-container {
            flex-grow: 1; /* Stretch to fill vertical space */
            display: flex;
            flex-direction: column;
            background: var(--result-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 10px;
        }

        .result-area {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-word;
            text-align: left;
            font-size: clamp(18px, 4vw, 22px);
            line-height: 1.6;
            overflow-y: auto;
            max-height: 200px;
        }

        #status-message {
            font-size: 15px;
            opacity: 0.5;
            text-align: center;
            width: 100%;
        }

        /* Emoji Name Info */
        .emoji-names {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 15px;
            line-height: 1.4;
            text-align: center;
        }

        /* Twemoji CSS */
        img.emoji {
            height: 1.2em;
            width: 1.2em;
            margin: 0 .15em 0 .15em;
            vertical-align: -0.2em;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Footer */
        footer {
            margin-top: auto;
            font-size: 12px;
            opacity: 0.5;
        }
        footer a { color: var(--text-color); text-decoration: none; }
        footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    
    <div class="glass-container">
        <div class="top-controls">
            <button class="theme-toggle" id="theme-toggle" title="Toggle Theme">🌙</button>
            <div class="lang-selector">
                <select id="lang-select">
                    <option value="en">🇺🇸 English</option>
                    <option value="ko">🇰🇷 한국어</option>
                    <option value="ja">🇯🇵 日本語</option>
                </select>
            </div>
        </div>

        <h1 data-i18n="title">Emoji Decoder 🔍</h1>
        <p class="subtitle" data-i18n="subtitle">Paste the entire message containing broken "square box" (□) emojis<br>to reveal what they actually are.</p>

        <div class="input-group">
            <textarea id="emoji-input" data-i18n-placeholder="placeholder" placeholder="Paste your message here..." autocomplete="off" spellcheck="false"></textarea>
        </div>
        
        <!-- History Tray -->
        <div class="history-tray" id="history-tray">
            <div class="history-empty" data-i18n="historyEmpty">Recent emojis will appear here</div>
        </div>

        <div class="result-container">
            <div class="result-area" id="result-area">
                <div id="status-message" data-i18n="defaultStatus">The decoded message will appear here.</div>
            </div>
            
            <div class="emoji-names" id="emoji-names"></div>
        </div>
        
        <footer data-i18n="footer">
            Parsed and rendered using <a href="https://github.com/twitter/twemoji" target="_blank">Twemoji</a>
        </footer>
    </div>

    <script>
        // -----------------------------
        // 1. i18n & Theme Logic
        // -----------------------------
        const i18nData = {
            en: {
                title: 'Emoji Decoder 🔍',
                subtitle: 'Paste the entire message containing broken "square box" (□) emojis<br>to reveal what they actually are.',
                placeholder: 'Paste your message here...',
                defaultStatus: 'The decoded message will appear here.',
                historyEmpty: 'Recent emojis will appear here',
                footer: 'Parsed and rendered using <a href="https://github.com/twitter/twemoji" target="_blank">Twemoji</a>'
            },
            ko: {
                title: '이모티콘 해독기 🔍',
                subtitle: '네모(□)로 깨진 이모티콘이 포함된 메시지 전체를<br>아래에 붙여넣어 실제 이모티콘을 확인하세요.',
                placeholder: '여기에 메시지를 붙여넣으세요...',
                defaultStatus: '해독된 메시지가 여기에 나타납니다.',
                historyEmpty: '최근 해독한 이모티콘 기록',
                footer: '<a href="https://github.com/twitter/twemoji" target="_blank">Twemoji</a>를 사용하여 파싱 및 렌더링됨'
            },
            ja: {
                title: '絵文字デコーダー 🔍',
                subtitle: '文字化けした「四角い箱」(□)の絵文字を含むメッセージ全体を<br>貼り付けて、実際の絵文字を確認してください。',
                placeholder: 'ここにメッセージを貼り付けます...',
                defaultStatus: 'デコードされたメッセージがここに表示されます。',
                historyEmpty: '最近デコードされた絵文字',
                footer: '<a href="https://github.com/twitter/twemoji" target="_blank">Twemoji</a>を使用して解析およびレンダリング'
            }
        };

        let currentLang = localStorage.getItem('preferredLang') || 'ko';
        const langSelect = document.getElementById('lang-select');
        langSelect.value = currentLang;

        function applyLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('preferredLang', lang);
            document.documentElement.lang = lang;
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18nData[lang][key]) el.innerHTML = i18nData[lang][key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (i18nData[lang][key]) el.placeholder = i18nData[lang][key];
            });
            
            if (!document.getElementById('emoji-input').value.trim()) resetUI();
        }

        langSelect.addEventListener('change', (e) => applyLanguage(e.target.value));

        // Theme Setup
        const themeToggleBtn = document.getElementById('theme-toggle');
        let currentTheme = localStorage.getItem('theme');
        if (!currentTheme) {
            currentTheme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            themeToggleBtn.textContent = theme === 'light' ? '☀️' : '🌙';
        }
        
        applyTheme(currentTheme);
        themeToggleBtn.addEventListener('click', () => {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            applyTheme(currentTheme);
        });

        // -----------------------------
        // 2. Emoji Dictionary & App Logic
        // -----------------------------
        const inputField = document.getElementById('emoji-input');
        const resultArea = document.getElementById('result-area');
        const namesArea = document.getElementById('emoji-names');
        const historyTray = document.getElementById('history-tray');
        
        let emojiDictionary = {};
        
        // Fetch dictionary asynchronously
        fetch('https://cdn.jsdelivr.net/npm/unicode-emoji-json@latest/data-by-emoji.json')
            .then(res => res.json())
            .then(data => emojiDictionary = data)
            .catch(err => console.error("Failed to load emoji dictionary", err));

        // History Management
        let history = JSON.parse(localStorage.getItem('emojiHistory') || '[]');
        
        function renderHistory() {
            if (history.length === 0) {
                historyTray.innerHTML = `<div class="history-empty" data-i18n="historyEmpty">${i18nData[currentLang].historyEmpty}</div>`;
                return;
            }
            historyTray.innerHTML = '';
            history.forEach(char => {
                const span = document.createElement('span');
                span.className = 'history-item';
                span.textContent = char;
                twemoji.parse(span, { folder: '72x72', ext: '.png' });
                span.addEventListener('click', () => {
                    inputField.value = char;
                    decodeMessage();
                });
                historyTray.appendChild(span);
            });
        }
        renderHistory();
        
        function addToHistory(char) {
            // Only add single/few characters, not full sentences
            if (char.length > 5) return; 
            history = history.filter(h => h !== char);
            history.unshift(char);
            if (history.length > 10) history.pop();
            localStorage.setItem('emojiHistory', JSON.stringify(history));
            renderHistory();
        }

        function resetUI() {
            resultArea.innerHTML = `<div id="status-message" data-i18n="defaultStatus">${i18nData[currentLang].defaultStatus}</div>`;
            namesArea.textContent = '';
        }

        // Main Decoder
        function decodeMessage() {
            const val = inputField.value.trim();
            if (!val) {
                resetUI();
                return;
            }

            resultArea.textContent = val;
            twemoji.parse(resultArea, {
                base: 'https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/',
                folder: '72x72',
                ext: '.png'
            });
            
            const images = resultArea.querySelectorAll('img.emoji');
            namesArea.innerHTML = '';
            
            // Check if it's only emojis
            const childNodes = Array.from(resultArea.childNodes);
            const hasText = childNodes.some(node => node.nodeType === Node.TEXT_NODE && node.textContent.trim() !== '');
            
            if (!hasText && images.length > 0) {
                images.forEach(img => {
                    img.style.height = '2.5em';
                    img.style.width = '2.5em';
                    img.style.margin = '0 0.1em';
                });
                resultArea.style.justifyContent = 'center';
                resultArea.style.display = 'flex';
                resultArea.style.flexWrap = 'wrap';
                
                // Add to history if it's a single emoji pasting
                addToHistory(val);
                
                if (images.length === 1) {
                    const rawEmoji = images[0].alt;
                    if (emojiDictionary[rawEmoji]) {
                        namesArea.innerHTML = `<strong>${emojiDictionary[rawEmoji].name}</strong>`;
                    }
                } else {
                    const names = Array.from(images).map(img => emojiDictionary[img.alt]?.name).filter(Boolean);
                    if (names.length > 0) namesArea.innerHTML = names.join(', ');
                }
            } else {
                resultArea.style.display = 'block';
            }
        }

        inputField.addEventListener('input', decodeMessage);
        inputField.addEventListener('focus', () => inputField.select());

        // PWA Setup
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW setup failed'));
            });
        }

        applyLanguage(currentLang);
    </script>
</body>
</html>
